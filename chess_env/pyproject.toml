[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess_env"
version = "0.0.1"
dependencies = [
  "gymnasium",
  "numpy",
  "torch>=2.0",
  "wandb",
  "matplotlib",
  "pandas",
  "pre-commit",
]

[tool.hatch.version]
path = "__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["chess_env"]
